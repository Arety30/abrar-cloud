<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrar Cloud - Sign Up</title>
  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #cbdbe6; /* Light-blue matte background */
      --card-bg: #121418;  /* Central dark-grey rectangular card */
      --cyan-glow: #00f2fe; /* Glowing neon-cyan */
      --input-bg: #1f232b;
      --input-border-focus: #5dade2; /* Glowing light-blue */
      --btn-bg: #0d2c54;   /* Solid dark-blue */
      --btn-hover: #163f73;
      --text-white: #ffffff;
      --text-grey: #8a8f9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-color);
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px; /* Extra padding top/bottom for taller card */
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 540px;
      border-radius: 24px; /* No sharp corners */
      border: 1.5px solid rgba(0, 242, 254, 0.5); /* Glowing neon-cyan border edge */
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25), 
                  inset 0 0 2px rgba(0, 242, 254, 0.2);
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-white);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.18em; /* Gap between letters */
      word-spacing: 0.25em;   /* Small gap between words */
      margin-bottom: 40px;
    }

    /* Stack of input fields */
    .input-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 2.5in; /* 2.5-inch vertical buffer between input stacks and button rows */
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 100px; /* Pill-shaped oval */
      padding: 16px 26px;
      font-size: 1rem;
      color: var(--text-white); /* Typed text is white */
      font-family: 'Outfit', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Placeholder style */
    .input-field::placeholder {
      color: var(--text-grey); /* Placeholder is grey */
      opacity: 1;
    }

    /* Focus state */
    .input-field:focus {
      border-color: var(--input-border-focus); /* Glowing light-blue border */
      box-shadow: 0 0 12px rgba(93, 173, 226, 0.5);
      outline: none;
    }

    /* Centered single button container */
    .button-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .btn {
      width: 100%;
      max-width: 260px; /* Beautiful centered design */
      background: var(--btn-bg); /* Solid dark-blue button */
      color: var(--text-white);
      border: none;
      border-radius: 100px; /* Oval pill */
      padding: 16px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(13, 44, 84, 0.3);
    }

    /* Button hover & active states */
    .btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(13, 44, 84, 0.45);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(13, 44, 84, 0.3);
    }

    /* Media queries for responsiveness */
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
      }
      .title {
        font-size: 1.75rem;
        margin-bottom: 30px;
      }
      .btn {
        max-width: 100%;
      }
      .input-stack {
        margin-bottom: 2in; /* Slightly reduced for small screens */
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Abrar Cloud</div>
    
    <!-- Input Fields -->
    <div class="input-stack">
      <div class="input-group">
        <input type="text" class="input-field" placeholder="Real Name" aria-label="Real Name">
      </div>
      <div class="input-group">
        <input type="text" class="input-field" placeholder="Username" aria-label="Username">
      </div>
      <div class="input-group">
        <input type="email" class="input-field" placeholder="Email" aria-label="Email">
      </div>
      <div class="input-group">
        <input type="password" class="input-field" placeholder="Create Password" aria-label="Create Password">
      </div>
      <div class="input-group">
        <input type="password" class="input-field" placeholder="Confirm Password" aria-label="Confirm Password">
      </div>
    </div>

    <!-- Base centered button -->
    <div class="button-row">
      <button class="btn" type="button">Next</button>
    </div>
  </div>

</body>
</html>
